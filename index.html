<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LocalEats | Local's Best Kota & Braai Delivery</title>
    <meta name="description" content="Find nearby Kota and braai shops with LocalEats. Collect your meal and pay at the shop." />
    <meta name="keywords" content="Local, Kota, Braai, Food Delivery, LocalEats, South Africa, Street Food, Takeaway" />
    <link rel="manifest" href="/manifest.json?v=2" />
    <link rel="icon" type="image/png" href="/logo.png?v=2" />
    <link rel="apple-touch-icon" href="/logo.png?v=2" />
    <meta name="theme-color" content="#FF6B00" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://localeatssa.co.za/" />
    <meta property="og:title" content="LocalEats | Local's Best Kota & Braai" />
    <meta property="og:description" content="Find nearby kitchens for pickup with LocalEats." />
    <meta property="og:image" content="https://picsum.photos/seed/localeats/1200/630" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://localeatssa.co.za/" />
    <meta property="twitter:title" content="LocalEats | Local's Best Kota & Braai" />
    <meta property="twitter:description" content="Find nearby kitchens for pickup with LocalEats." />
    <meta property="twitter:image" content="https://picsum.photos/seed/localeats/1200/630" />

    <script>
      // Only initialize OneSignal if we are on the production domain or allowLocalhost is set.
      // We skip initialization in the AI Studio preview to prevent Service Worker fetch interception errors.
      if (window.location.hostname === 'www.localeatssa.co.za' || window.location.hostname === 'localeatssa.co.za') {
        const script = document.createElement('script');
        script.src = "https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js";
        script.defer = true;
        document.head.appendChild(script);

        window.OneSignalDeferred = window.OneSignalDeferred || [];
        OneSignalDeferred.push(async function(OneSignal) {
          await OneSignal.init({
            appId: "9b7e9074-b5ad-4f31-b2a5-6d9fa1a31aa2",
            notifyButton: {
              enable: true,
            },
            allowLocalhostAsSecureOrigin: true
          });
        });
      } else {
        // Unregister conflicting legacy/external service workers in preview, but preserve our custom SW
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for(let registration of registrations) {
              const activeWorker = registration.active || registration.installing || registration.waiting;
              if (activeWorker && (activeWorker.scriptURL.includes('onesignal') || activeWorker.scriptURL.includes('OneSignal'))) {
                registration.unregister();
                console.log('Unregistered OneSignal Service Worker:', registration);
              }
            }
          });
        }
        // Keep versioned app-shell caches; the service worker manages their lifecycle.
      }

      // Global errors are observed, never used to erase auth, offline data or PWA caches.
      // React's ErrorBoundary owns crash recovery and preserves unsent user intent.
      window.addEventListener('error', function(e) {
        console.error('Runtime App Error:', e.message, 'At:', e.filename, e.lineno, e.colno);
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.error('Unhandled Promise Rejection, Reason:', e.reason);
      });
    </script>
    <style>
      #startup-shell {
        --shell-line: #e2e8f0;
        --shell-soft: #f1f5f9;
        min-height: 100vh;
        background: white;
      }
      body:has(#startup-shell) { margin: 0; }
      #startup-shell * { box-sizing: border-box; }
      #startup-shell .startup-header {
        padding: calc(8px + env(safe-area-inset-top, 0px)) 12px 8px;
        border-bottom: 1px solid var(--shell-line);
      }
      #startup-shell .startup-row, #startup-shell .startup-nav, #startup-shell .startup-main {
        max-width: 1280px;
        margin-inline: auto;
      }
      #startup-shell .startup-row { display: flex; gap: 6px; overflow: hidden; align-items: center; }
      #startup-shell .startup-row + .startup-row { margin-top: 8px; }
      #startup-shell .startup-shape {
        display: block;
        flex-shrink: 0;
        height: 32px;
        width: 60px;
        border-radius: 16px;
        background: var(--shell-soft);
      }
      #startup-shell .startup-brand { width: 105px; background: var(--shell-line); }
      #startup-shell .startup-location { width: 96px; margin-right: auto; }
      #startup-shell .startup-dot { width: 36px; height: 36px; border-radius: 50%; }
      #startup-shell .startup-main { padding: 42px 16px 112px; }
      #startup-shell .startup-title { width: 208px; background: var(--shell-line); border-radius: 8px; }
      #startup-shell .startup-subtitle { width: 160px; height: 16px; margin-top: 8px; }
      #startup-shell .startup-accent { width: 32px; height: 4px; margin: 67px 0 53px; background: #ea580c; }
      #startup-shell .startup-cards { display: grid; gap: 12px; }
      #startup-shell .startup-card { border: 1px solid var(--shell-line); border-radius: 28px; overflow: hidden; }
      #startup-shell .startup-photo { aspect-ratio: 16 / 10; background: var(--shell-line); }
      #startup-shell .startup-copy { padding: 16px; min-height: 110px; }
      #startup-shell .startup-copy .startup-shape { width: 60%; height: 20px; }
      #startup-shell .startup-nav {
        position: fixed;
        inset: auto 12px calc(12px + env(safe-area-inset-bottom, 0px));
        max-width: 448px;
        height: 62px;
        display: flex;
        align-items: center;
        justify-content: space-around;
        background: white;
        border: 1px solid var(--shell-line);
        border-radius: 24px;
      }
      @media (min-width: 640px) {
        #startup-shell .startup-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
        #startup-shell .startup-photo { aspect-ratio: 16 / 9; }
        #startup-shell .startup-accent { margin-bottom: 14px; }
      }
      @media (min-width: 768px) {
        #startup-shell .startup-cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        #startup-shell .startup-nav { max-width: 512px; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="startup-shell" role="status" aria-busy="true" aria-label="Loading LocalEats Home">
        <div class="startup-header" aria-hidden="true">
          <div class="startup-row">
            <span class="startup-shape startup-brand"></span><span class="startup-shape startup-location"></span>
            <span class="startup-shape startup-dot"></span><span class="startup-shape startup-dot"></span><span class="startup-shape startup-dot"></span>
          </div>
          <div class="startup-row">
            <span class="startup-shape"></span><span class="startup-shape"></span><span class="startup-shape"></span>
            <span class="startup-shape"></span><span class="startup-shape"></span><span class="startup-shape"></span>
          </div>
        </div>
        <div class="startup-main" aria-hidden="true">
          <span class="startup-shape startup-title"></span><span class="startup-shape startup-subtitle"></span>
          <span class="startup-shape startup-accent"></span>
          <div class="startup-cards">
            <div class="startup-card"><div class="startup-photo"></div><div class="startup-copy"><span class="startup-shape"></span></div></div>
            <div class="startup-card"><div class="startup-photo"></div><div class="startup-copy"><span class="startup-shape"></span></div></div>
            <div class="startup-card"><div class="startup-photo"></div><div class="startup-copy"><span class="startup-shape"></span></div></div>
          </div>
        </div>
        <div class="startup-nav" aria-hidden="true">
          <span class="startup-shape startup-dot"></span><span class="startup-shape startup-dot"></span><span class="startup-shape startup-dot"></span>
          <span class="startup-shape startup-dot"></span><span class="startup-shape startup-dot"></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
