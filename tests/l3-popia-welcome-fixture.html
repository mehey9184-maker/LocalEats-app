<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head>
<body>
  <div id="root"></div>
  <script type="module">
    import React, {useState} from 'react';
    import {createRoot} from 'react-dom/client';
    import {SplashScreen} from '../src/screens/SplashScreen.tsx';
    import {PopiaLegalDrawer} from '../src/components/PopiaLegalDrawer.tsx';
    import '../src/index.css';
    function Harness() {
      const [loginCount,setLoginCount]=useState(0);
      return React.createElement(React.Fragment,null,
        React.createElement(SplashScreen,{
          session:null,userProfile:null,
          onNext:()=>{},
          onGuestBrowse:()=>{},
          onLogin:()=>setLoginCount(count=>count+1),
        }),
        React.createElement(PopiaLegalDrawer),
        React.createElement('output',{'data-testid':'l3-login-clicks','aria-live':'polite'},String(loginCount))
      );
    }
    createRoot(document.getElementById('root')).render(React.createElement(Harness));
  </script>
</body>
</html>
