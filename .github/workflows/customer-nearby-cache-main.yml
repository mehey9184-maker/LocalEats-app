name: Customer Nearby Catalog Cache Main Release Gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/App.tsx'
      - 'src/services/customerPickup.ts'
      - 'src/services/nearbyCatalogCache.ts'
      - 'tests/customer-nearby-cache-main.test.mjs'
      - '.github/workflows/customer-nearby-cache-main.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  client-nearby-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Exact-location nearby catalog, pickup, cache safety and P7 regressions
        run: node --experimental-strip-types --test tests/customer-nearby-cache-main.test.mjs tests/original-pickup.test.mjs tests/pickup-activation.test.mjs tests/customer-cache-safety-main.test.mjs
      - name: TypeScript and checkout safety
        run: npm run lint
      - name: Full Client build
        run: npm run build
