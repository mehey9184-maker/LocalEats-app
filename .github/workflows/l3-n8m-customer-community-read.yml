name: L3-N8M Customer community read contract and original pickup UI
on:
  pull_request:
    branches:
      - review/l3-n8l-customer-public-read-privacy
    paths:
      - 'src/services/customerCommunityReadContract.ts'
      - 'tests/l3-n8m-customer-community-read-contract.test.mjs'
      - 'LocalEats_App_Functionality_Documentation.md'
      - '.github/workflows/l3-n8m-customer-community-read.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  customer-community-no-write:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
      - name: No hosted tokens, private keys or Production access
        run: |
          test -z "${FIREBASE_PRIVATE_KEY:-}${FIREBASE_CLIENT_EMAIL:-}${GOOGLE_APPLICATION_CREDENTIALS:-}${SUPABASE_SERVICE_ROLE_KEY:-}${DATABASE_URL:-}${VERCEL_TOKEN:-}${FIREBASE_TOKEN:-}"
      - name: Install existing pinned Customer dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Customer community read-only contract and pickup regressions
        run: |
          node --experimental-strip-types --test tests/l3-n8m-customer-community-read-contract.test.mjs
          npm run test:pickup-integration
          node --experimental-strip-types --test tests/l3-n8l-*.test.mjs
      - name: Customer TypeScript
        run: npm run lint
      - name: Synthetic Customer Preview Vite build, no hosted Auth or pushes
        env:
          VERCEL_ENV: preview
          VERCEL_URL: localeats-customer-staging-r52d-review-synthetic.vercel.app
          LOCALEATS_STAGING_ONLY: 'true'
          VITE_FIREBASE_CONFIG_SOURCE: environment
          VITE_FIREBASE_PROJECT_ID: localeats-staging
          VITE_FIREBASE_FIRESTORE_DATABASE_ID: (default)
          VITE_FIREBASE_API_KEY: synthetic-not-real
          VITE_FIREBASE_AUTH_DOMAIN: localeats-staging.firebaseapp.com
          VITE_FIREBASE_APP_ID: 1:123456789:web:synthetic
          VITE_FIREBASE_MESSAGING_SENDER_ID: '123456789'
          VITE_FIREBASE_STORAGE_BUCKET: localeats-staging.firebasestorage.app
          VITE_FIREBASE_VAPID_KEY: synthetic-vapid-only-not-valid
          VITE_LOCALEATS_API_URL: https://localeats-api-staging-r52d-mehey9184-makers-projects.vercel.app
          VITE_PICKUP_ORDERING_ENABLED: 'false'
        run: |
          npm run build
          grep -q '"projectId":"localeats-staging"' dist/firebase-messaging-sw.js
          ! grep -q '"projectId":"localeats-5e26e"' dist/firebase-messaging-sw.js
      - name: No UI wiring or mutation activation
        run: |
          ! grep -q customerCommunityReadContract src/App.tsx
          echo L3_N8M_CUSTOMER_SYNTHETIC_GET_ONLY_NO_STAGING_OR_PRODUCTION_DEPLOY
