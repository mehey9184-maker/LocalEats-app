name: Customer login trust — real password only, no fake biometrics or editable staff role
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/screens/auth/LoginScreen.tsx'
      - 'tests/customer-biometric-signin-trust-main.test.mjs'
      - '.github/workflows/customer-biometric-signin-trust-main.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  customer-login-trust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VITE_PICKUP_ORDERING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Reject fake biometric login and user-editable Customer role
        run: node --experimental-strip-types --test tests/customer-biometric-signin-trust-main.test.mjs
      - name: Existing Customer logout, guest, auth startup and pickup regressions
        run: node --experimental-strip-types --test tests/customer-real-logout-main-safe.test.mjs tests/customer-guest-profile-main-safe.test.mjs tests/customer-startup-auth-routing.test.mjs tests/original-pickup.test.mjs
      - run: npm run lint
      - run: npm run build
