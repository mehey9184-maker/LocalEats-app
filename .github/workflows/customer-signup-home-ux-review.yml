name: Customer signup-to-Home UI review (isolated, no account)
on:
  pull_request:
    branches: [feature/customer-qr-guest-install-20261122, review/l3-n8u-s-current-main-outside-radius-browse, main]
    paths:
      - 'src/screens/SplashScreen.tsx'
      - 'src/components/LocalKotaHeroPhoto.tsx'
      - 'src/components/BottomNavigation.tsx'
      - 'tests/welcome-kota-motion.test.mjs'
      - 'docs/LOCALEATS_KOTA_HERO_ANIMATION_2026-11-22.md'
      - 'src/screens/auth/SignUpScreen.tsx'
      - 'src/screens/auth/SetupPasswordScreen.tsx'
      - 'src/screens/auth/SuccessScreen.tsx'
      - 'src/components/SignupFlowHeader.tsx'
      - 'src/components/LocalKotaIllustration.tsx'
      - 'src/App.tsx'
      - 'src/components/ShopCard.tsx'
      - 'src/components/BlurUpImage.tsx'
      - 'src/services/publicBrowseCatalog.ts'
      - 'src/services/nearbyCatalogCache.ts'
      - 'tests/l3-p1-home-*'
      - 'tests/signup-home-ux-*'
      - 'tests/firebase-auth-compatibility.test.mjs'
      - 'src/lib/supabase.ts'
      - '.github/workflows/customer-signup-home-ux-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  onboarding-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    env:
      VITE_PICKUP_ORDERING_ENABLED: 'false'
      VITE_PROFILE_WRITES_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Preserve PR #128 QR, install, pickup and other Customer regressions
        run: node --experimental-strip-types --test tests/*.test.mjs
      - name: TypeScript check for actual React components
        run: npm run lint
      - name: Production-style source build (ordering disabled)
        run: npm run build
      - name: Read-only live PWA, API CORS, and catalog health (GET/OPTIONS only)
        run: node --test tests/customer-production-http-readonly-smoke.mjs
      - name: Install isolated Chromium browser
        run: npx playwright install chromium
      - name: Test 320px, 390px and desktop Welcome to Home without live signup
        env:
          SIGNUP_UX_ARTIFACT_DIR: /tmp/localeats-signup-home-ux
        run: node tests/signup-home-ux-browser.mjs
      - name: Upload actual React screen screenshots (not Production)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signup-home-ui-screens
          path: /tmp/localeats-signup-home-ux
          if-no-files-found: ignore
          retention-days: 7
      - name: L3-P1 isolated customer shop cards: first-card timing, 320/390/desktop, no writes
        env:
          L3_P1_ARTIFACT_DIR: /tmp/localeats-l3-p1-home
        run: node tests/l3-p1-home-browser.mjs
      - name: Upload L3-P1 verified-menu screenshots (synthetic, not Production)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: l3-p1-home-visual-evidence
          path: /tmp/localeats-l3-p1-home
          if-no-files-found: ignore
          retention-days: 7
