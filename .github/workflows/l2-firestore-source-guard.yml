name: L2C Firestore named database and approval fail-closed guard

on:
  pull_request:
    branches: [main]
    paths:
      - 'firebase.json'
      - 'scripts/verify-firestore-deploy.cjs'
      - 'tests/firestore-release-guard.test.cjs'
      - '.github/workflows/l2-firestore-source-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-firebase-deploy-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout source without GitHub credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify Firebase config hooks and safety behavior
        run: |
          node --test tests/firestore-release-guard.test.cjs
          node -e "const c=require('./firebase.json'); if(!(c.firestore.predeploy||[]).includes('node scripts/verify-firestore-deploy.cjs')) process.exit(1)"
      - name: Require explicit rules-hash approval and refuse wrong Firebase project
        shell: bash
        run: |
          set -euo pipefail
          if GCLOUD_PROJECT=localeats-5e26e node scripts/verify-firestore-deploy.cjs > /tmp/guard.log 2>&1;then
            echo "Unapproved Firebase rules were accepted"; exit 1
          fi
          grep -q 'FIRESTORE_RULES_RELEASE_HASH_NOT_APPROVED' /tmp/guard.log
          approved_sha=$(sha256sum firestore.rules | awk '{print $1}')
          GCLOUD_PROJECT=localeats-5e26e LOCALEATS_FIRESTORE_RELEASE_APPROVED_SHA256="$approved_sha" node scripts/verify-firestore-deploy.cjs
          if GCLOUD_PROJECT=wrong-project LOCALEATS_FIRESTORE_RELEASE_APPROVED_SHA256="$approved_sha" node scripts/verify-firestore-deploy.cjs > /tmp/wrong-project.log 2>&1;then
            echo "Wrong Firebase project accepted"; exit 1
          fi
          grep -q 'FIRESTORE_DEPLOY_WRONG_FIREBASE_PROJECT' /tmp/wrong-project.log
