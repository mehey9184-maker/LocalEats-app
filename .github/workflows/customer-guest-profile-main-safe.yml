name: Customer Guest Profile Login Safe Merge
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/App.tsx'
      - 'src/lib/profileAccess.ts'
      - 'tests/customer-guest-profile-main-safe.test.mjs'
      - 'docs/CLIENT_GUEST_PROFILE_SAFE_MERGE_20261106.md'
      - '.github/workflows/customer-guest-profile-main-safe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guest-profile-main-safe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VITE_PICKUP_ORDERING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Guest Profile goes to Login, registered editor guarded
        run: node --experimental-strip-types --test tests/customer-guest-profile-main-safe.test.mjs
      - name: Core pickup and original Client regressions
        run: node --experimental-strip-types --test tests/original-pickup.test.mjs tests/checkout-render.test.mjs tests/customer-nearby-cache-main.test.mjs tests/customer-cache-safety-main.test.mjs
      - name: TypeScript typecheck
        run: npm run lint
      - name: Production build (order creation disabled)
        run: npm run build
