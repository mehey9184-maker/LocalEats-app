name: L3-N8U-Y isolated My-Kota mobile browse UI (no production writes)
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/ShopCard.tsx'
      - 'src/services/pickupMapping.ts'
      - 'src/services/catalogFacts.ts'
      - 'src/index.css'
      - 'tests/pilot-mobile-*'
      - '.github/workflows/l3-n8u-y-isolated-mobile-cards.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot-mobile-cards:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Check types before isolated browser
        run: npm run lint
      - name: Install real headless Chromium
        run: npx playwright install chromium
      - name: Synthetic My-Kota no-GPS and outside-radius mobile cards
        run: node tests/pilot-mobile-browser.mjs
      - name: Confirm no production deployment or order operations
        run: echo 'L3-N8U-Y isolated component harness only; browser intercepts all external requests.'
