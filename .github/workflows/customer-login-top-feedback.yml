name: Customer login Apple and top-notification UI safety
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/screens/auth/LoginScreen.tsx'
      - 'src/components/AppleBrandIcon.tsx'
      - 'src/components/AppNotificationToast.tsx'
      - 'src/App.tsx'
      - 'tests/login-feedback-*'
      - 'tests/login-apple-notification.test.mjs'
      - '.github/workflows/customer-login-top-feedback.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  login-feedback:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      VITE_PICKUP_ORDERING_ENABLED: 'false'
      VITE_PROFILE_WRITES_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Preserve all existing Customer/QR/pickup regressions
        run: node --experimental-strip-types --test tests/*.test.mjs
      - name: TypeScript
        run: npm run lint
      - name: Production-style build with ordering OFF
        run: npm run build
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Isolated actual Login React and notification positioning at 320px, 390px and desktop
        env:
          LOGIN_FEEDBACK_SCREENSHOTS: /tmp/localeats-login-feedback
        run: node tests/login-feedback-browser.mjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: login-apple-top-notice
          path: /tmp/localeats-login-feedback
          if-no-files-found: ignore
          retention-days: 7
