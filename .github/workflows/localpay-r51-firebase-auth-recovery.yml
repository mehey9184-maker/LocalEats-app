name: LocalEats R5.1 — Firebase Identity and Session Recovery (Draft Only)

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/App.tsx'
      - 'src/lib/supabase.ts'
      - 'src/lib/firebase.ts'
      - 'src/lib/apiAuth.ts'
      - 'src/services/customerPickup.ts'
      - 'src/services/pickupHistoryAuth.ts'
      - 'src/screens/auth/LoginScreen.tsx'
      - 'tests/r50-pickup-auth-recovery.test.mjs'
      - 'tests/r51-firebase-auth-contract.test.mjs'
      - 'tests/r51/**'
      - '.github/workflows/localpay-r51-firebase-auth-recovery.yml'

permissions:
  contents: read

jobs:
  r51-source-contract-no-services:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      VITE_PICKUP_ORDERING_ENABLED: 'false'
      PICKUP_WRITES_ENABLED: 'false'
      REWARDS_ACTIVATION_ENABLED: 'false'
      LOCALPAY_LIVE_WALLET_ENABLED: 'false'
    steps:
      - name: Checkout inert draft without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node 22 for source-level contract tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Refuse hosted credentials and live feature gates
        run: |
          test -z "${FIREBASE_PROJECT_ID:-}"
          test -z "${FIREBASE_PRIVATE_KEY:-}"
          test -z "${SUPABASE_URL:-}"
          test -z "${DATABASE_URL:-}"
          test -z "${VITE_LOCALEATS_API_URL:-}"
          test "$VITE_PICKUP_ORDERING_ENABLED" = false
          test "$REWARDS_ACTIVATION_ENABLED" = false
      - name: Source-contract Firebase compatibility adapter and pickup recovery
        run: |
          node --experimental-strip-types --test tests/r51-firebase-auth-contract.test.mjs
          node --experimental-strip-types --test tests/r50-pickup-auth-recovery.test.mjs
          node --experimental-strip-types --test tests/r49-customer-auth-recovery.test.mjs

  r51-real-firebase-auth-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      GCLOUD_PROJECT: demo-localeats-r51
      VITE_PICKUP_ORDERING_ENABLED: 'false'
      PICKUP_WRITES_ENABLED: 'false'
      REWARDS_ACTIVATION_ENABLED: 'false'
      LOCALPAY_LIVE_WALLET_ENABLED: 'false'
    steps:
      - name: Checkout inert draft without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node 22 and locked dependencies
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Reject real Firebase and Supabase secrets
        run: |
          test "$GCLOUD_PROJECT" = demo-localeats-r51
          test -z "${FIREBASE_PROJECT_ID:-}"
          test -z "${FIREBASE_PRIVATE_KEY:-}"
          test -z "${FIREBASE_SERVICE_ACCOUNT:-}"
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -z "${SUPABASE_URL:-}"
          test -z "${DATABASE_URL:-}"
          test -z "${VITE_FIREBASE_PROJECT_ID:-}"
          test -z "${VITE_LOCALEATS_API_URL:-}"
          test "$PICKUP_WRITES_ENABLED" = false
      - name: Install local SDK dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify Firebase Auth revocation and fresh same-account login using local emulator only
        run: |
          npx --yes firebase-tools@15.35.0 emulators:exec \
            --only auth --project demo-localeats-r51 \
            --config tests/r51/firebase.emulator.json \
            "node --experimental-strip-types --test tests/r51/firebase-auth-recovery-emulator.test.mjs"
      - name: Verify no live order or LocalPay creation introduced
        run: |
          test -f tests/r51/firebase.emulator.json
          test ! -e src/rewards/r51LocalPayWallet.ts
