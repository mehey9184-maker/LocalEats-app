name: Customer Deferred Modules Main Release Gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/App.tsx'
      - 'tests/customer-deferred-modules-main.test.mjs'
      - '.github/workflows/customer-deferred-modules-main.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  customer-deferred-features:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Optional module, nearby catalog, pickup, cache and checkout guards
        run: node --experimental-strip-types --test tests/customer-deferred-modules-main.test.mjs tests/customer-nearby-cache-main.test.mjs tests/customer-cache-safety-main.test.mjs tests/pickup-activation.test.mjs tests/original-pickup.test.mjs
      - name: TypeScript
        run: npm run lint
      - name: Full Client build
        run: npm run build
      - name: Report nontrivial output bundles
        run: |
          node --input-type=module - <<'NODE'
          import {readdirSync,statSync} from 'node:fs';
          import {join} from 'node:path';
          const dir='dist/assets';
          const js=readdirSync(dir).filter(name=>name.endsWith('.js'))
            .map(name=>({name,bytes:statSync(join(dir,name)).size}))
            .sort((a,b)=>b.bytes-a.bytes);
          for(const f of js.slice(0,15))console.log((f.bytes/1024).toFixed(1)+' KiB  '+f.name);
          const scanner=js.filter(f=>/html5|qrcode|cropper/i.test(f.name));
          console.log('Deferred named chunks:',scanner.map(f=>f.name).join(', ')||'Rolled into hashed chunks');
          NODE
