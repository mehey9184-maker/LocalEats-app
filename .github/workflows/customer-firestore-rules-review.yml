name: Client Firestore Rules — Review Only
on:
  push:
    branches: [security/firestore-review-only-20261105]
  pull_request:
    branches: [repair/customer-prod-readiness-p0-20261103]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-emulator-review:
    name: Local demo-only Firebase rules and compatibility tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - name: Local demo Firebase Auth, known exploit regression and compatibility tests
        run: >
          npx --yes firebase-tools@15.34.2
          emulators:exec
          --project demo-localeats-p0
          --only auth,firestore
          "npm run test:p0-auth-emulator && npm run test:p0-firestore-rules-gate && node --experimental-strip-types --test tests/customer-firestore-rules-compat-review.test.mjs"
      - name: TypeScript and original client build
        run: npm run lint && npm run build
