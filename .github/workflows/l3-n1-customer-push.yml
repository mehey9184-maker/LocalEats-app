name: L3-N1 Customer notification receipt (no cloud sends)
on:
  pull_request:
    paths:
      - 'public/firebase-messaging-sw.js'
      - 'src/App.tsx'
      - 'tests/customer-l3-n1-push.test.mjs'
      - 'tests/l3-n2-firebase-stage.test.mjs'
      - 'tests/l3-n2-customer-device-check.test.mjs'
      - 'tests/l3-n2-stage-origins.test.mjs'
      - 'tests/l3-n3-paired-staging-api.test.mjs'
      - 'src/services/customerPushStaging.ts'
      - 'src/screens/SettingsScreen.tsx'
      - 'src/pickup/client.ts'
      - 'scripts/l3-n2-staging-fcm.mjs'
      - 'vite.config.ts'
      - 'src/lib/firebase.ts'
      - 'src/sw.ts'
      - 'package.json'
      - '.github/workflows/l3-n1-customer-push.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    env:
      VITE_PICKUP_ORDERING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --experimental-strip-types --test tests/customer-push-p1.test.mjs tests/customer-l3-n1-push.test.mjs tests/l3-n2-firebase-stage.test.mjs tests/l3-n2-customer-device-check.test.mjs tests/l3-n2-stage-origins.test.mjs tests/l3-n3-paired-staging-api.test.mjs
      - run: npm run lint
      - run: npm run build
      - name: Synthetic isolated staging build (public fake config; no Firebase cloud)
        env:
          LOCALEATS_STAGING_ONLY: "true"
          VERCEL_ENV: "preview"
          VERCEL_GIT_COMMIT_REF: "review/l3-n3-customer-api-pairing"
          VERCEL_URL: "localeats-customer-staging-r52d-ci2c83ab.vercel.app"
          VITE_FIREBASE_CONFIG_SOURCE: "environment"
          VITE_FIREBASE_API_KEY: "synthetic-public-firebase-key"
          VITE_FIREBASE_AUTH_DOMAIN: "localeats-staging.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "localeats-staging"
          VITE_FIREBASE_STORAGE_BUCKET: "localeats-staging.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "987654321"
          VITE_FIREBASE_APP_ID: "1:987654321:web:synthetic"
          VITE_FIREBASE_VAPID_KEY: "synthetic-vapid-public"
          VITE_PICKUP_ORDERING_ENABLED: "false"
          VITE_LOCALEATS_API_URL: "https://localeats-api-staging-r52d.vercel.app"
          VITE_CUSTOMER_PUSH_STAGING_ORIGIN: "https://localeats-customer-staging-r52d.vercel.app"
        run: |
          npm run build
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            import assert from "node:assert/strict";
            const worker=readFileSync("dist/firebase-messaging-sw.js","utf8");
            const pwa=readFileSync("dist/sw.js","utf8");
            assert.match(worker,/"projectId":"localeats-staging"/);
            assert.doesNotMatch(worker,/"projectId":"localeats-5e26e"/);
            assert.match(pwa,/localeats-staging/);
            assert.match(worker,/customer_push_test/);
            const pairedApi="https://localeats-api-staging-r52d-git-112955-mehey9184-makers-projects.vercel.app";
            assert.ok(paths.some(path=>fs.readFileSync("dist/assets/"+path,"utf8").includes(pairedApi)),
              "Expected the exact isolated staging API branch alias to be compiled into the Customer");

            const fs=await import("node:fs");
            const paths=fs.readdirSync("dist/assets").filter(x=>x.endsWith(".js"));
            assert.ok(paths.some(path=>fs.readFileSync("dist/assets/"+path,"utf8")
              .includes("https://localeats-customer-staging-r52d-ci2c83ab.vercel.app")),
              "Expected exact Vercel Preview origin to be compiled into the Client");

          '
