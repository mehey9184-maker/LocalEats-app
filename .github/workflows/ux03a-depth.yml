name: UX-03A isolated card depth (NO DEPLOY)
on:
  pull_request:
    paths: ['.github/workflows/ux03a-depth.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  depth:
    name: UX-03A - ${{ matrix.component }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: Customer
            repo: mehey9184-maker/LocalEats-app
            sha: 98cadc5f551c81c95ecd5318299dfb715ff2de80
          - component: Merchant
            repo: mehey9184-maker/LocalEats-Dashboard.2
            sha: 3ed2b833bd0cf7ed0bf4a79a4ba4239235905f91
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Verify exact source and locked dependencies
        working-directory: source
        env:
          EXPECTED_SHA: ${{ matrix.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          npm ci --no-audit --no-fund
          git diff --exit-code -- package.json package-lock.json
      - name: Install locked API prerequisites
        if: matrix.component == 'Merchant'
        working-directory: source/localeats-api
        run: |
          npm ci --no-audit --no-fund
          git diff --exit-code -- package.json package-lock.json
      - name: Install locked Customer Chromium
        if: matrix.component == 'Customer'
        working-directory: source
        run: ./node_modules/.bin/playwright install chromium
      - name: Isolated root regression and card depth comparison
        working-directory: source
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail
          mkdir -p ../evidence
          sudo unshare --net -- bash -euc '
            ip link set lo up
            exec setpriv --reuid="$1" --regid="$2" --init-groups env -i PATH="$3" HOME="$4" CI=true COMPONENT="$5" PICKUP_WRITES_ENABLED=false DELIVERY_WRITES_ENABLED=false VITE_PICKUP_ORDERING_ENABLED=false VITE_PROFILE_WRITES_ENABLED=false VITE_MERCHANT_FAKE_ORDERS_ENABLED=false bash -euc "
              test \"\$(ip -o link show | wc -l)\" -eq 1
              test -z \"\$(ip route show default)\"
              npm run lint
              if [ \"\$COMPONENT\" = Merchant ]; then
                ./node_modules/.bin/tsc --noEmit --pretty false
                npm --prefix localeats-api run build
              fi
              node --experimental-strip-types --test tests/*.test.mjs
              npm run build
              if [ \"\$COMPONENT\" = Merchant ]; then
                node tests/ux03-stat-depth-browser.mjs ../evidence
              else
                node tests/ux03-customer-depth-browser.mjs ../evidence
              fi
              git diff --exit-code
            "
          ' _ "$(id -u)" "$(id -g)" "$PATH" "$HOME" "$COMPONENT"
      - name: Retain before and after evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: UX03A-${{ matrix.component }}-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
