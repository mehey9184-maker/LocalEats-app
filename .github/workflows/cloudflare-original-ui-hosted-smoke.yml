name: Preview original LocalEats Customer and Merchant screens (no live writes)
on:
  push:
    branches: [preview/cf-customer-original-ui-readonly-20261123]
permissions:
  contents: read
jobs:
  real-hosted-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install chromium
      - name: Read-only HTTPS and mounted original React UI at 390px and desktop
        run: node scripts/cloudflare-original-ui-hosted-smoke.mjs
      - name: Attach guest-only screenshots (no accounts / customer data)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: localeats-original-cloudflare-guest-screens
          path: artifacts/preview
          if-no-files-found: ignore
          retention-days: 5
