name: LocalEats R5.2F — Original Logo Integrity (Preview only)
on:
  pull_request:
    paths:
      - '.github/workflows/localeats-r52f-original-logo-verification.yml'
      - 'public/logo.png'
permissions:
  contents: read
jobs:
  original-logo-chunk:
    name: Original logo chunk ${{ matrix.chunk }}
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        chunk: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify SHA of approved original image and emit one public asset chunk
        env:
          CHUNK: ${{ matrix.chunk }}
        run: |
          set -euo pipefail
          test "$(git hash-object public/logo.png)" = "e1ba54098c57a9c99bafd72d4d593eb98a23b010"
          test "$(stat -c '%s' public/logo.png)" = "1276778"
          echo 'R52F_ASSET_PUBLIC_LOGO=public/logo.png'
          echo "R52F_CHUNK_INDEX=$CHUNK"
          echo "R52F_PART_BEGIN=$CHUNK"
          dd if=public/logo.png bs=350000 skip="$CHUNK" count=1 status=none | base64 -w 4096
          echo "R52F_PART_END=$CHUNK"
          echo 'R52F_ASSET_TRANSFER_IS_PUBLIC_IMAGE_ONLY=true'
