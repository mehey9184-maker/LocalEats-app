name: Customer Profile Save Confirmation and Account Isolation
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/App.tsx'
      - 'src/lib/profileService.ts'
      - 'src/lib/profileConfirmation.ts'
      - 'tests/customer-profile-write-isolation.test.mjs'
      - 'docs/CLIENT_PROFILE_SAVE_CONFIRMATION_20261106.md'
      - '.github/workflows/customer-profile-save-confirmation.yml'
permissions:
  contents: read
jobs:
  profile-save-confirmation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VITE_PICKUP_ORDERING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify receipt, account switch and queued profile isolation
        run: node --experimental-strip-types --test tests/customer-profile-write-isolation.test.mjs
      - name: Baseline pickup, guest login and logout regressions
        run: node --experimental-strip-types --test tests/original-pickup.test.mjs tests/customer-guest-profile-main-safe.test.mjs tests/customer-real-logout-main-safe.test.mjs
      - name: TypeScript and build
        run: |
          npm run lint
          npm run build
