name: L4-H1B.2 pinned offline build baseline (NO DEPLOY)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/l4-h1b2-baseline.yml'
permissions:
  contents: read
jobs:
  baseline:
    name: Baseline - ${{ matrix.component }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: Customer
            repository: mehey9184-maker/LocalEats-app
            sha: 7872fc844b442219be86ffafc19092124f8e8e42
            workdir: source
          - component: Merchant
            repository: mehey9184-maker/LocalEats-Dashboard.2
            sha: 45eb99d93c60efc0bfafcaa866d7a17f829fab28
            workdir: source
          - component: API
            repository: mehey9184-maker/LocalEats-Dashboard.2
            sha: 45eb99d93c60efc0bfafcaa866d7a17f829fab28
            workdir: source/localeats-api
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Verify exact source and locked install (public registry only; no provider credentials)
        working-directory: ${{ matrix.workdir }}
        env:
          EXPECTED_SHA: ${{ matrix.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node --version
          npm --version
          test -f package-lock.json
          sha256sum package-lock.json
          start=$(date +%s)
          npm ci --no-audit --no-fund
          echo "BASELINE install_seconds=$(($(date +%s)-start))"
      - name: Offline baseline with loopback only, non-root UID, explicit write gates OFF
        working-directory: ${{ matrix.workdir }}
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail
          script="$RUNNER_TEMP/l4-h1b2-baseline.sh"
          cat > "$script" <<'BASH'
          set -uo pipefail
          failures=0
          run() {
            local label="$1"; shift
            local start status
            start=$(date +%s)
            "$@"
            status=$?
            printf 'BASELINE %s exit=%s elapsed_seconds=%s\n' "$label" "$status" "$(($(date +%s)-start))"
            if [ "$status" -ne 0 ]; then failures=$((failures+1)); fi
            return "$status"
          }
          test "$(id -u)" -ne 0 || exit 1
          echo "OFFLINE ISOLATION: network interfaces and routes"
          ip -brief link
          ip route
          test "$(ip -o link show | wc -l)" -eq 1 || exit 1
          test -z "$(ip route show default)" || exit 1
          test "$PICKUP_WRITES_ENABLED" = false || exit 1
          node --version
          npm --version
          run dependency_tree bash -c 'npm ls --all --json > /tmp/localeats-dependency-tree.json' || true
          # Do not publish raw dependency tree or any environment values.
          case "$COMPONENT" in
            Customer)
              run typescript npm run lint || true
              run unit node --experimental-strip-types --test \
                tests/l3-p1-p4-integration.test.mjs \
                tests/l3-p1-catalog-speed-accuracy.test.mjs \
                tests/l3-p2-data-saver-offline.test.mjs \
                tests/l3-p3-motion-navigation.test.mjs \
                tests/l3-p4-shop-trust.test.mjs \
                tests/customer-nearby-cache-main.test.mjs \
                tests/customer-public-browse-without-gps.test.mjs \
                tests/customer-outside-pickup-area-current-main.test.mjs \
                tests/customer-closed-browse-main.test.mjs \
                tests/catalog-trust.test.mjs \
                tests/default-image-fallback.test.mjs \
                tests/login-apple-notification.test.mjs \
                tests/original-pickup.test.mjs || true
              run build npm run build || true
              ;;
            Merchant)
              run eslint npm run lint || true
              run typescript ./node_modules/.bin/tsc --noEmit --pretty false || true
              run unit node --experimental-strip-types --test \
                tests/l3-p4-merchant-confirmation.test.mjs \
                tests/merchant-pickup.test.mjs \
                tests/merchant-handover.test.mjs \
                tests/merchant-shop-revalidation.test.mjs \
                tests/merchant-order-inbox-p1.test.mjs \
                tests/merchant-push-registration.test.mjs \
                tests/default-image-fallback.test.mjs \
                tests/merchant-marketing-counter.test.mjs \
                tests/l4-r1-orders-layout-switch.test.mjs \
                tests/l4-r1c-functional-contracts.test.mjs \
                tests/l4-pickup-core-ui-freeze.test.mjs || true
              run build npm run build || true
              ;;
            API)
              run build_and_test npm test || true
              run mock_preview node --test tests/l3-n8u-z-preview-readonly-smoke.test.mjs || true
              ;;
            *) exit 1 ;;
          esac
          if [ "$COMPONENT" != API ] && [ -d dist ]; then
            python3 - <<'PY'
          from pathlib import Path
          import gzip
          for ext in ('.js', '.css'):
              files = [p for p in Path('dist/assets').rglob('*') if p.is_file() and p.suffix == ext]
              raw = sum(p.stat().st_size for p in files)
              gz = sum(len(gzip.compress(p.read_bytes(), compresslevel=9, mtime=0)) for p in files)
              print(f'BASELINE bundle {ext}: files={len(files)} raw_bytes={raw} gzip9_bytes={gz}')
          PY
          fi
          printf 'BASELINE %s failed_commands=%s\n' "$COMPONENT" "$failures"
          test "$failures" -eq 0
          BASH
          chmod 700 "$script"
          sudo unshare --net -- bash -euc '
            ip link set lo up
            exec setpriv --reuid="$1" --regid="$2" --init-groups env -i \
              PATH="$3" HOME="$4" CI=true COMPONENT="$5" \
              PICKUP_WRITES_ENABLED=false VITE_PICKUP_ORDERING_ENABLED=false \
              VITE_PROFILE_WRITES_ENABLED=false MERCHANT_AVAILABILITY_WRITES_ENABLED=false \
              ADMIN_RIDER_VERIFICATION_WRITES_ENABLED=false VITE_MERCHANT_FAKE_ORDERS_ENABLED=false \
              bash "$6"
          ' _ "$(id -u)" "$(id -g)" "$PATH" "$HOME" "$COMPONENT" "$script"
