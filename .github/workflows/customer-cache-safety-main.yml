name: Customer Cache Safety Main Release Gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'public/sw.js'
      - 'public/service-worker.js'
      - 'tests/customer-cache-safety-main.test.mjs'
      - '.github/workflows/customer-cache-safety-main.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  customer-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Cache isolation and baseline pickup tests
        run: node --experimental-strip-types --test tests/customer-cache-safety-main.test.mjs tests/pickup-activation.test.mjs tests/original-pickup.test.mjs
      - name: TypeScript
        run: npm run lint
      - name: Production-quality build (Preview only)
        run: npm run build
