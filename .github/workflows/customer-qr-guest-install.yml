name: Customer QR guest and optional install
on:
  pull_request:
    branches: [main, review/l3-n8u-s-current-main-outside-radius-browse]
    paths:
      - 'src/App.tsx'
      - 'src/components/CustomerInstallOffer.tsx'
      - 'src/components/InstallAppHelp.tsx'
      - 'src/hooks/useAppInstallation.ts'
      - 'src/services/customerEntry.ts'
      - 'src/services/menuInstallInvite.ts'
      - 'src/services/pwaInstallInvite.ts'
      - 'src/services/installInstructions.ts'
      - 'tests/customer-qr-guest-install.test.mjs'
      - 'vite.config.ts'
      - '.github/workflows/customer-qr-guest-install.yml'
  push:
    branches: [feature/customer-qr-guest-install-20261122]
permissions:
  contents: read
jobs:
  guest-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --experimental-strip-types --test tests/*.test.mjs
      - run: npm run lint
      - run: npm run build
        env:
          VITE_PICKUP_ORDERING_ENABLED: 'false'
          VITE_LOCALPAY_ENABLED: 'false'
          VITE_REWARDS_ENABLED: 'false'
