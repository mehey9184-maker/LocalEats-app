name: Client Optional Home Location for Pickup
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/screens/auth/CompleteProfileScreen.tsx'
      - 'tests/customer-pickup-profile-optional-location.test.mjs'
      - 'docs/CLIENT_PICKUP_PROFILE_OPTIONAL_LOCATION_20261106.md'
      - '.github/workflows/customer-pickup-profile-optional-location.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  customer-pickup-profile-optional-location:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VITE_PICKUP_ORDERING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Check pickup profile no longer requires rider GPS
        run: node --experimental-strip-types --test tests/customer-pickup-profile-optional-location.test.mjs
      - name: Original Customer pickup, nearby and profile safety regressions
        run: node --experimental-strip-types --test tests/original-pickup.test.mjs tests/checkout-render.test.mjs tests/customer-nearby-cache-main.test.mjs tests/customer-guest-profile-main-safe.test.mjs
      - name: TypeScript
        run: npm run lint
      - name: Customer build
        run: npm run build
