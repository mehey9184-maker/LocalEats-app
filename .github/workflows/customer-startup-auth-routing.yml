name: Customer startup auth routing checks
on:
  push:
    branches: [repair/customer-direct-home-on-refresh-01]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Startup routing and existing pickup regressions
        run: node --experimental-strip-types --test tests/customer-startup-auth-routing.test.mjs tests/customer-closed-menu-browsing.test.mjs tests/customer-closed-pickup-previews.test.mjs tests/customer-home-location-loading.test.mjs tests/customer-display-performance.test.mjs tests/customer-collection-tracking.test.mjs tests/original-pickup.test.mjs
      - name: Type check
        run: npm run lint
      - name: Production-style build
        run: npm run build
