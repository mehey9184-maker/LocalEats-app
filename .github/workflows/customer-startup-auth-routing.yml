name: Customer startup auth routing checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/App.tsx'
      - 'src/lib/supabase.ts'
      - 'src/components/AppSkeletonLoader.tsx'
      - 'src/components/BlurUpImage.tsx'
      - 'src/components/ShopCard.tsx'
      - 'src/components/StartupExperience.tsx'
      - 'src/components/OnboardingTour.tsx'
      - 'src/components/InteractiveTour.tsx'
      - 'src/components/CookieConsentBanner.tsx'
      - 'src/components/PopiaLegalDrawer.tsx'
      - 'src/services/startupGuides.ts'
      - 'tests/startup-*'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/customer-startup-auth-routing.test.mjs'
      - '.github/workflows/customer-startup-auth-routing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Startup routing and existing pickup regressions
        run: node --experimental-strip-types --test tests/startup-guides.test.mjs tests/customer-startup-auth-routing.test.mjs tests/customer-nearby-cache-main.test.mjs tests/customer-page-splitting-main.test.mjs tests/checkout-render.test.mjs tests/original-pickup.test.mjs
      - name: Install isolated test browser
        run: npx playwright install --with-deps chromium
      - name: Mobile startup, keyboard and reduced motion walkthrough
        run: node tests/startup-browser.mjs
      - name: Type check
        run: npm run lint
      - name: Production-style build
        run: npm run build
