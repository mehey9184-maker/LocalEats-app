name: L4-H5C baseline merchant recovery faults (NO DEPLOY)
on:
  pull_request:
    paths: ['.github/workflows/l4-h5c-baseline-faults.yml']
permissions:
  contents: read
jobs:
  baseline:
    name: Exact baseline Merchant operational recovery fault observations
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: mehey9184-maker/LocalEats-Dashboard.2
          ref: f1a5f1820fbe97aa5d548ba9f9cbe0c3fff34cb3
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Verify unchanged Merchant runtime and locked dependencies
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = f1a5f1820fbe97aa5d548ba9f9cbe0c3fff34cb3
          git diff --exit-code 7ebebd11305650cf52d3fb91de451943cbc27dd9 HEAD -- src localeats-api/src package.json package-lock.json
          npm ci --no-audit --no-fund
      - name: Run actual API and coordinator with isolated provider fixtures
        run: |
          set -euo pipefail
          sudo unshare --net -- bash -euc '
            ip link set lo up
            test "$(ip -o link show | wc -l)" -eq 1
            test -z "$(ip route show default)"
            exec setpriv --reuid="$1" --regid="$2" --init-groups env -i PATH="$3" HOME="$4" CI=true PICKUP_WRITES_ENABLED=false VITE_PICKUP_ORDERING_ENABLED=false node --experimental-strip-types --test tests/resilience/h5c-baseline-faults.test.mjs
          ' _ "$(id -u)" "$(id -g)" "$PATH" "$HOME"
