name: Customer catalog and inbox performance checks
on:
  push:
    branches:
      - repair/customer-catalog-inbox-speed-01
  workflow_dispatch:
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Location/inbox display cache regressions
        run: node --experimental-strip-types --test tests/customer-display-performance.test.mjs
      - name: Pickup integration and collection tracking
        run: node --experimental-strip-types --test tests/original-pickup.test.mjs tests/customer-collection-tracking.test.mjs
      - name: TypeScript check
        run: npm run lint
      - name: Build Customer Preview
        run: npm run build
