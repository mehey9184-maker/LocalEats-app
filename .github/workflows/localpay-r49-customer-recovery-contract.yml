name: LocalPay R4.9 — Customer Auth Recovery Contract Only

on:
  pull_request:
    branches:
      - main
    paths:
      - 'tests/r49-customer-auth-recovery.test.mjs'
      - 'src/pickup/client.ts'
      - 'src/services/customerPickup.ts'
      - 'src/screens/OrderHistoryScreen.tsx'
      - 'src/App.tsx'
      - '.github/workflows/localpay-r49-customer-recovery-contract.yml'

permissions:
  contents: read

jobs:
  read-only-customer-401-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      VITE_PICKUP_ORDERING_ENABLED: 'false'
      PICKUP_WRITES_ENABLED: 'false'
      REWARDS_ACTIVATION_ENABLED: 'false'
    steps:
      - name: Checkout draft PR without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node 22 for native TypeScript stripping
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check no real data/services or ordering activation
        run: |
          test -z "${FIREBASE_PROJECT_ID:-}"
          test -z "${FIREBASE_PRIVATE_KEY:-}"
          test -z "${SUPABASE_URL:-}"
          test -z "${DATABASE_URL:-}"
          test "$VITE_PICKUP_ORDERING_ENABLED" = false
      - name: Test actual Customer pickup client 401/retry and account-switch contract with synthetic transport
        run: node --experimental-strip-types --test tests/r49-customer-auth-recovery.test.mjs
      - name: No active Customer rewards or order code introduced
        run: |
          test -f tests/r49-customer-auth-recovery.test.mjs
          test ! -e src/rewards/r49LocalPayWallet.ts
