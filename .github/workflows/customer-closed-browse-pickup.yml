name: Customer approved closed shops — menu browse without order
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/App.tsx'
      - 'src/services/pickupMapping.ts'
      - 'tests/customer-closed-browse-main.test.mjs'
      - 'tests/customer-nearby-cache-main.test.mjs'
      - '.github/workflows/customer-closed-browse-pickup.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  approved-closed-shop:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
      - name: Install locked Customer dependencies without live credentials
        run: npm ci --no-audit --no-fund
      - name: TypeScript check
        run: npm run lint
      - name: Run closed-shop mapping and nearby-catalog caching tests
        run: node --experimental-strip-types --test tests/customer-closed-browse-main.test.mjs tests/customer-nearby-cache-main.test.mjs
      - name: Verify Customer build
        run: npm run build
