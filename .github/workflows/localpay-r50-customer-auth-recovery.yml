name: LocalPay R5.0 — Customer Pickup Auth Recovery Preview Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/App.tsx'
      - 'src/screens/OrderHistoryScreen.tsx'
      - 'src/screens/PickupTrackingScreen.tsx'
      - 'src/services/pickupHistoryAuth.ts'
      - 'tests/r50-pickup-auth-recovery.test.mjs'
      - '.github/workflows/localpay-r50-customer-auth-recovery.yml'

permissions:
  contents: read

jobs:
  r50-inert-client-auth-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VITE_PICKUP_ORDERING_ENABLED: 'false'
      PICKUP_WRITES_ENABLED: 'false'
      REWARDS_ACTIVATION_ENABLED: 'false'
      LOCALPAY_LIVE_WALLET_ENABLED: 'false'
    steps:
      - name: Checkout Customer draft without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22 native source-only checks
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Refuse actual Firebase, Supabase and pickup activation
        run: |
          test -z "${FIREBASE_PROJECT_ID:-}"
          test -z "${FIREBASE_PRIVATE_KEY:-}"
          test -z "${SUPABASE_URL:-}"
          test -z "${DATABASE_URL:-}"
          test "$VITE_PICKUP_ORDERING_ENABLED" = false
          test "$REWARDS_ACTIVATION_ENABLED" = false
      - name: Validate native Customer revoked token and login guard contracts
        run: |
          node --experimental-strip-types --test tests/r50-pickup-auth-recovery.test.mjs
          node --experimental-strip-types --test tests/r49-customer-auth-recovery.test.mjs
      - name: Ensure no Rewards route, financial feature or live ordering flag introduced
        run: |
          test -f src/services/pickupHistoryAuth.ts
          test ! -e src/rewards/r50LocalPayWallet.ts
