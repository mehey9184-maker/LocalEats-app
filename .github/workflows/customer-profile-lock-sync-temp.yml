name: Client P0 one-time npm override lock reconciliation
on:
  push:
    branches: [repair/customer-prod-readiness-p0-20261103]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/customer-profile-lock-sync-temp.yml
permissions:
  contents: write
jobs:
  update-lock:
    if: github.ref == 'refs/heads/repair/customer-prod-readiness-p0-20261103'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/customer-prod-readiness-p0-20261103
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Reconcile lockfile only (no install scripts, no app code execution)
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile only if changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already matches override."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(client P0): lock CJS jose for serverless Firebase verification"
          git push origin HEAD:repair/customer-prod-readiness-p0-20261103
