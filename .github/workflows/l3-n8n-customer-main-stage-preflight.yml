name: L3-N8N Customer main reconciliation and paired Preview preflight
on:
  pull_request:
    branches:
      - review/l3-n8m-customer-community-read-contract
    paths:
      - 'tests/l3-n8n/**'
      - 'docs/L3_N8N_CUSTOMER_MAIN_RECONCILIATION_AND_PAIRED_PREVIEW.md'
      - 'LocalEats_App_Functionality_Documentation.md'
      - '.github/workflows/l3-n8n-customer-main-stage-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  customer-source-only-audit-and-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
      - name: No hosted project credentials or deployment tokens
        run: |
          test -z "${FIREBASE_TOKEN:-}${FIREBASE_PRIVATE_KEY:-}${FIREBASE_CLIENT_EMAIL:-}${GOOGLE_APPLICATION_CREDENTIALS:-}${SUPABASE_SERVICE_ROLE_KEY:-}${DATABASE_URL:-}${VERCEL_TOKEN:-}"
      - name: Install pinned Customer dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Main drift / direct Firebase / mock Supabase classification gate
        run: node --test tests/l3-n8n/*.test.mjs
      - name: Existing original Customer pickup and staged privacy/community tests
        run: |
          npm run test:pickup-integration
          node --experimental-strip-types --test tests/l3-n8l-*.test.mjs
          node --experimental-strip-types --test tests/l3-n8m-*.test.mjs
      - name: Customer TypeScript and original UI source check
        run: npm run lint
      - name: Synthetic staging build ONLY, with public fake Firebase config
        env:
          VERCEL_ENV: preview
          VERCEL_URL: localeats-customer-staging-r52d-review-synthetic.vercel.app
          LOCALEATS_STAGING_ONLY: 'true'
          VITE_FIREBASE_CONFIG_SOURCE: environment
          VITE_FIREBASE_PROJECT_ID: localeats-staging
          VITE_FIREBASE_FIRESTORE_DATABASE_ID: (default)
          VITE_FIREBASE_API_KEY: synthetic-not-real
          VITE_FIREBASE_AUTH_DOMAIN: localeats-staging.firebaseapp.com
          VITE_FIREBASE_APP_ID: 1:123456789:web:synthetic
          VITE_FIREBASE_MESSAGING_SENDER_ID: '123456789'
          VITE_FIREBASE_STORAGE_BUCKET: localeats-staging.firebasestorage.app
          VITE_FIREBASE_VAPID_KEY: synthetic-vapid-not-valid
          VITE_LOCALEATS_API_URL: https://localeats-api-staging-r52d-mehey9184-makers-projects.vercel.app
          VITE_PICKUP_ORDERING_ENABLED: 'false'
        run: |
          npm run build
          grep -q '"projectId":"localeats-staging"' dist/firebase-messaging-sw.js
          ! grep -q '"projectId":"localeats-5e26e"' dist/firebase-messaging-sw.js
      - name: Explicitly block stale-branch merge and live ordering claims
        run: |
          ! test -f src/services/pickupReceipt.ts
          echo L3_N8N_STALE_CUSTOMER_REVIEW_BASE_REQUIRES_MAIN_RECONCILIATION
          echo L3_N8N_NO_DEPLOY_NO_MAIN_MERGE_NO_REAL_FIREBASE_SIGNIN_NO_ORDER
