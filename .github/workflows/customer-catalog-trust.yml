name: Customer catalog trust
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/App.tsx'
      - 'src/components/ShopCard.tsx'
      - 'src/components/ShopChatModal.tsx'
      - 'src/screens/CheckoutScreen.tsx'
      - 'src/services/catalogFacts.ts'
      - 'src/services/menuHelp.ts'
      - 'src/services/menuHelpResponse.ts'
      - 'tests/menu-help-response.test.mjs'
      - 'server.ts'
      - 'tests/catalog-*.test.mjs'
      - '.github/workflows/customer-catalog-trust.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog-trust:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --experimental-strip-types --test tests/catalog-trust.test.mjs tests/catalog-facts.test.mjs tests/menu-help-response.test.mjs tests/checkout-render.test.mjs tests/original-pickup.test.mjs
      - run: npm run lint
      - run: npm run build
