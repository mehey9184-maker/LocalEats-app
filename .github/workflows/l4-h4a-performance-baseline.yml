name: L4-H4A performance baseline (NO DEPLOY)
on:
  pull_request:
    paths: ['.github/workflows/l4-h4a-performance-baseline.yml']
permissions:
  contents: read
jobs:
  browser:
    name: Cold built application mobile-profile baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 8e39f6ff8f01ac1ec573b87b16afd67395ad702e
          path: customer
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: mehey9184-maker/LocalEats-Dashboard.2
          ref: 130ae5146a749b3cea76e2e94c52b0212231db8a
          path: merchant
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Prepare locked dependencies and Chromium
        run: |
          set -euo pipefail
          test "$(git -C customer rev-parse HEAD)" = 8e39f6ff8f01ac1ec573b87b16afd67395ad702e
          test "$(git -C merchant rev-parse HEAD)" = 130ae5146a749b3cea76e2e94c52b0212231db8a
          (cd customer && npm ci --no-audit --no-fund && ./node_modules/.bin/playwright install chromium)
          (cd merchant && npm ci --no-audit --no-fund)
      - name: Build and benchmark in isolated network namespace
        run: |
          set -euo pipefail
          script="$RUNNER_TEMP/h4a-browser.sh"
          cat > "$script" <<'BASH'
          set -euo pipefail
          test "$(ip -o link show | wc -l)" -eq 1
          test -z "$(ip route show default)"
          (cd merchant && npm run build)
          (cd customer && npm run build && node tests/performance/h4a-browser.mjs ../merchant/dist)
          BASH
          sudo unshare --net -- bash -euc '
            ip link set lo up
            exec setpriv --reuid="$1" --regid="$2" --init-groups env -i PATH="$3" HOME="$4" CI=true PICKUP_WRITES_ENABLED=false VITE_PICKUP_ORDERING_ENABLED=false VITE_PROFILE_WRITES_ENABLED=false VITE_MERCHANT_FAKE_ORDERS_ENABLED=false bash "$5"
          ' _ "$(id -u)" "$(id -g)" "$PATH" "$HOME" "$script"
  api:
    name: Loopback synthetic API latency and request counts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 8e39f6ff8f01ac1ec573b87b16afd67395ad702e
          path: customer
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: mehey9184-maker/LocalEats-Dashboard.2
          ref: 130ae5146a749b3cea76e2e94c52b0212231db8a
          path: merchant
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Prepare locked API dependencies
        working-directory: merchant/localeats-api
        run: |
          test "$(git rev-parse HEAD)" = 130ae5146a749b3cea76e2e94c52b0212231db8a
          npm ci --no-audit --no-fund
      - name: Compile and measure offline
        working-directory: merchant/localeats-api
        run: |
          set -euo pipefail
          script="$RUNNER_TEMP/h4a-api.sh"
          cat > "$script" <<'BASH'
          set -euo pipefail
          test "$(ip -o link show | wc -l)" -eq 1
          test -z "$(ip route show default)"
          npm run build
          node tests/performance/h4a-api-benchmark.mjs
          BASH
          sudo unshare --net -- bash -euc '
            ip link set lo up
            exec setpriv --reuid="$1" --regid="$2" --init-groups env -i PATH="$3" HOME="$4" CI=true PICKUP_WRITES_ENABLED=false bash "$5"
          ' _ "$(id -u)" "$(id -g)" "$PATH" "$HOME" "$script"
  database:
    name: Disposable PostgreSQL query shape costs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: mehey9184-maker/LocalEats-Dashboard.2
          ref: 130ae5146a749b3cea76e2e94c52b0212231db8a
          persist-credentials: false
      - name: Run synthetic SQL with observed index subset
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 130ae5146a749b3cea76e2e94c52b0212231db8a
          name="h4a-pg-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$name" --network none --rm -e POSTGRES_PASSWORD=synthetic_only -e POSTGRES_DB=h4a_lab postgres:17-alpine >/dev/null
          test "$(docker inspect -f '{{.HostConfig.NetworkMode}}' "$name")" = none
          ready=0
          for n in $(seq 1 45); do
            if docker logs "$name" 2>&1 | grep -q 'PostgreSQL init process complete; ready for start up.' && docker exec "$name" psql -XAt -U postgres -d h4a_lab -c 'select 1' | grep -qx 1; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          docker cp localeats-api/tests/performance/h4a "$name":/tmp/h4a
          docker exec "$name" psql -X -v ON_ERROR_STOP=1 -U postgres -d h4a_lab -f /tmp/h4a/baseline.SYNTHETIC_ONLY.sql | tee "$RUNNER_TEMP/h4a-plans.log"
          test "$(grep -c '^H4A_PLAN_PASS' "$RUNNER_TEMP/h4a-plans.log")" = 2
