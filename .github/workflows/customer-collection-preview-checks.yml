name: Customer collection preview checks
on:
  push:
    branches:
      - repair/customer-collection-tracking-01
  workflow_dispatch:

permissions:
  contents: read

jobs:
  customer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Collection tracking regression tests
        run: node --experimental-strip-types --test tests/customer-collection-tracking.test.mjs
      - name: Existing pickup integration tests
        run: npm run test:pickup-integration
      - name: TypeScript check
        run: npm run lint
      - name: Customer app build
        run: npm run build
