name: LocalEats R5.2F — Customer Staging Safety Gate (Offline)
on:
  pull_request:
    branches: [main]
    paths:
      - 'server.ts'
      - 'src/services/customerPickup.ts'
      - 'src/lib/firebaseConfigPolicy.ts'
      - 'src/hooks/useShopsData.ts'
      - 'tests/r52f-customer-staging-deploy-gates.test.mjs'
      - '.github/workflows/localeats-r52f-customer-staging-guard.yml'
permissions:
  contents: read
jobs:
  no-customer-legacy-write-in-staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      LOCALEATS_STAGING_ONLY: 'true'
      VITE_PICKUP_ORDERING_ENABLED: 'false'
      PICKUP_WRITES_ENABLED: 'false'
      PROFILE_WRITES_ENABLED: 'false'
      REWARDS_ACTIVATION_ENABLED: 'false'
      LOCALPAY_LIVE_WALLET_ENABLED: 'false'
    steps:
      - name: Checkout draft source without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Fail if real service secrets were injected
        run: |
          set -euo pipefail
          for k in FIREBASE_PRIVATE_KEY FIREBASE_CLIENT_EMAIL SUPABASE_SERVICE_ROLE_KEY SUPABASE_SECRET_KEY DATABASE_URL; do
            test -z "$(printenv "$k" || true)"
          done
          test "$LOCALEATS_STAGING_ONLY" = true
          test "$VITE_PICKUP_ORDERING_ENABLED" = false
      - name: Run local source-only staging safety tests
        run: node --test tests/r52f-customer-staging-deploy-gates.test.mjs
